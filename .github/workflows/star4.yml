name: Update Star Sports 3 Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:   # manual trigger
  push:
    branches:
      - main
    paths:
      - 'star4.py'

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
          # If you have a requirements.txt, use:
          # pip install -r requirements.txt

      - name: Run star4.py
        run: python star4.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

          # Stage and commit (skip if nothing to commit)
          git add voot.m3u
          git commit -m "Auto-update playlists: $(date -u)" || echo "No changes to commit"

          # Disable immediate exit on error so we can retry pushes
          set +e

          # Retry up to 5 times
          for i in 1 2 3 4 5; do
            echo "Push attempt $i of 5..."
            git pull --rebase origin main
            if git push origin main; then
              echo "✅ Push succeeded!"
              exit 0
            fi
            echo "❌ Push failed (attempt $i). Retrying in $((RANDOM % 10 + 1)) seconds..."
            sleep $((RANDOM % 10 + 1))
          done

          # If we get here, all retries failed
          set -e
          echo "❌ All 5 push attempts failed."
          exit 1
