name: JTV PLUS 8-9 Auto-Update
on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git User
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
      
      - name: Set Timezone
        run: |
          export TZ="Asia/Kolkata"
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
      
      - name: Sync Repository
        run: |
          git pull origin main --rebase --autostash
      
      - name: Download and Update Playlist (jtvplus8)
        run: |
          echo "⏱️  Current time: $(date +'%Y-%m-%d %H:%M:%S IST')"
          curl -sS -L -o jtvplus8.m3u "https://server.vodep39240327.workers.dev/channel/raw?=m3u"
          echo "✅ jtvplus8.m3u downloaded successfully"
          echo "📝 File size: $(wc -c < jtvplus8.m3u) bytes"

      - name: Download and Update Playlist (jtvplus9)
        run: |
          curl -sS -L -o jtvplus9.m3u "https://raw.githubusercontent.com/Diljan707/Automated-/refs/heads/main/JioTV_Auto.m3u"
          echo "✅ jtvplus9.m3u downloaded successfully"
          echo "📝 File size: $(wc -c < jtvplus9.m3u) bytes"

      - name: Download and Update Playlist (hotstarbackup)
        run: |
          curl -sS -L -o hotstarbackup.m3u "https://premiumplugx.com/htt/hot.php?playlist=1"
          echo "✅ hotstarbackup.m3u downloaded successfully"
          echo "📝 File size: $(wc -c < hotstarbackup.m3u) bytes"
      
      - name: Check for Changes
        id: check_changes
        run: |
          git add jtvplus8.m3u jtvplus9.m3u hotstarbackup.m3u
          
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changes detected"
            git reset HEAD jtvplus8.m3u jtvplus9.m3u hotstarbackup.m3u
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✏️  Changes detected"
          fi
      
      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "JTV PLUS Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
          echo "✔️  Changes committed"
      
      - name: Pull Before Push (Conflict Prevention)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git pull origin main --rebase --autostash || true
      
      - name: Push to Repository
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git push origin main
          echo "🚀 Pushed successfully to remote"
        continue-on-error: true
      
      - name: Handle Push Failure
        if: failure() && steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "⚠️  Push failed, attempting force-with-lease..."
          git push origin main --force-with-lease
      
      - name: Verify Files
        run: |
          for FILE in jtvplus8.m3u jtvplus9.m3u hotstarbackup.m3u; do
            if [ -f "$FILE" ]; then
              echo "✅ File $FILE exists"
              ls -lh "$FILE"
              echo "📊 File info:"
              file "$FILE"
              head -5 "$FILE"
            else
              echo "❌ File $FILE NOT found"
              ls -la
              exit 1
            fi
          done
      
      - name: Workflow Summary
        run: |
          echo "📊 Workflow Summary:"
          echo "  Repository: https://github.com/sportlive18/jio-tv-auto-update-playlist"
          echo "  Files: jtvplus8.m3u, jtvplus9.m3u, hotstarbackup.m3u"
          echo "  Time: $(date +'%Y-%m-%d %H:%M:%S IST')"
          echo "  Status: ✅ Complete"
