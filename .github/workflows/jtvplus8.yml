name: JTV PLUS 8 Auto-Update
on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git User
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
      
      - name: Set Timezone
        run: |
          export TZ="Asia/Kolkata"
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
      
      - name: Sync Repository
        run: |
          git pull origin main --rebase --autostash
      
      - name: Download and Update Playlist
        run: |
          echo "⏱️  Current time: $(date +'%Y-%m-%d %H:%M:%S IST')"
          curl -sS -L -o jtvplus8.m3u "https://m3u.cloudplay.qzz.io/jiotvplus.m3u"
          echo "✅ Playlist downloaded successfully"
          echo "📝 File size: $(wc -c < jtvplus8.m3u) bytes"
      
      - name: Check for Changes
        id: check_changes
        run: |
          # Add file to staging area to check if it has changes
          git add jtvplus8.m3u
          
          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changes detected"
            git reset HEAD jtvplus8.m3u
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✏️  Changes detected"
          fi
      
      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "JTV PLUS Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
          echo "✔️  Changes committed"
      
      - name: Pull Before Push (Conflict Prevention)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git pull origin main --rebase --autostash || true
      
      - name: Push to Repository
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git push origin main
          echo "🚀 Pushed successfully to remote"
        continue-on-error: true
      
      - name: Handle Push Failure
        if: failure() && steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "⚠️  Push failed, attempting force-with-lease..."
          git push origin main --force-with-lease
      
      - name: Verify File
        run: |
          if [ -f jtvplus8.m3u ]; then
            echo "✅ File jtvplus8.m3u exists"
            ls -lh jtvplus8.m3u
            echo "📊 File info:"
            file jtvplus8.m3u
            head -5 jtvplus8.m3u
          else
            echo "❌ File jtvplus8.m3u NOT found"
            ls -la
            exit 1
          fi
      
      - name: Workflow Summary
        run: |
          echo "📊 Workflow Summary:"
          echo "  Repository: https://github.com/sportlive18/jio-tv-auto-update-playlist"
          echo "  File: jtvplus8.m3u"
          echo "  Time: $(date +'%Y-%m-%d %H:%M:%S IST')"
          echo "  Status: ✅ Complete"
