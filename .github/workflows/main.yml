name: Update JioTV Playlist

on:
  schedule:
    - cron: '*/30 * * * *'          # Runs every 30 minutes
  workflow_dispatch:                # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - 'jtv.py'                    # Runs only if jtv.py changes

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # Required to push changes back

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull latest changes (rebase)
        run: git pull --rebase origin main

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: List files before script (debug)
        run: ls -la

      - name: Run jtv.py
        run: python jtv.py

      - name: List files after script (debug)
        run: ls -la

      - name: Verify output files exist
        run: |
          if [ ! -f jtv.m3u ] || [ ! -f jtv.json ]; then
            echo "ERROR: jtv.m3u or jtv.json not found after running script!"
            exit 1
          fi
          echo "Both files exist."

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

          # Force-add the generated files (even if .gitignore ignores them)
          git add -f jtv.m3u jtv.json

          # Commit only if there are changes; if not, skip silently
          git commit -m "Auto-update playlists: $(date -u)" || echo "No changes to commit"

          # Push the commit (if any) to main
          git push origin main
