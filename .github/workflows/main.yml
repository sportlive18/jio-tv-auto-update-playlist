name: Update JioTV Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jtv.py'  # Only trigger on script changes, not playlist updates

concurrency:
  group: update-playlist
  cancel-in-progress: false  # Don't cancel running jobs, queue them

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run jtv.py
        run: python jtv.py

      - name: Verify output files
        run: |
          echo "=== Directory listing ==="
          ls -la

          for FILE in jtv.m3u jtv.json; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: $FILE not found!"
              exit 1
            fi

            LINES=$(wc -l < "$FILE")
            echo "$FILE: $LINES lines"

            if [ "$LINES" -lt 10 ]; then
              echo "ERROR: $FILE is too small — likely empty or broken!"
              cat "$FILE"
              exit 1
            fi
          done

          echo "Verification passed."

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f jtv.m3u jtv.json

          if git diff --cached --quiet; then
            echo "No changes to commit — skipping push"
            exit 0
          fi

          # [skip ci] prevents this commit from triggering another workflow run
          git commit -m "Auto-update playlists: $(date -u) [skip ci]"

          # Pull with rebase just before push to avoid conflicts
          git pull --rebase origin main

          git push origin main
