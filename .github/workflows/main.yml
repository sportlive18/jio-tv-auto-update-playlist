name: Update JioTV Playlist

on:
  schedule:
    - cron: '*/30 * * * *'          # every 30 minutes
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jtv.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull latest changes (rebase)
        run: git pull --rebase origin main

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run jtv.py
        run: python jtv.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"

          git add jtv.m3u jtv.json
          git commit -m "Auto-update playlists: $(date -u)" || echo "No changes to commit"
          git push origin main
