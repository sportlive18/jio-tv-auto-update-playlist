name: Update JioTV Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jtv.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run jtv.py
        run: python jtv.py

      - name: Verify output files exist
        run: |
          if [ ! -f jtv.m3u ] || [ ! -f jtv.json ]; then
            echo "ERROR: jtv.m3u or jtv.json not found!"
            ls -la
            exit 1
          fi
          echo "Both files exist."
          wc -l jtv.m3u jtv.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sportlive18"
          git config --global user.email "271363488+sportlive18@users.noreply.github.com"
          git add -f jtv.m3u jtv.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update playlists: $(date -u)"
          git push origin main
